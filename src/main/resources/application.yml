server:
  port: ${SERVER_PORT}

spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: local
  application:
    name: multimodalAgent-agent
  reactor:
    context-propagation: auto
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:2s}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:false}
          ssl:
            enable: ${MAIL_SMTP_SSL_ENABLE:false}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:10000}
          timeout: ${MAIL_SMTP_TIMEOUT:10000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT:10000}

logging:
  file:
    name: ${LOG_FILE:}
  pattern:
    correlation: "[traceId=%X{traceId:-none} spanId=%X{spanId:-none}] "
  level:
    root: INFO

management:
  server:
    address: ${MANAGEMENT_SERVER_ADDRESS}
    port: ${MANAGEMENT_SERVER_PORT}
  prometheus:
    metrics:
      export:
        enabled: ${PROMETHEUS_EXPORT_ENABLED:true}
  tracing:
    enabled: ${TRACING_ENABLED:false}
    baggage:
      enabled: false
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT}
      timeout: ${OTLP_TRACING_TIMEOUT:10s}
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      deployment.environment: ${DEPLOYMENT_ENVIRONMENT:local}
  health:
    mail:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        multimodalagent.http.request: true
        multimodalagent.rag.retrieval: true
        multimodalagent.agent.latency: true

multimodal-agent:
  ai:
    provider: ${AI_PROVIDER:ollama}
    temperature: ${AI_TEMPERATURE:0.35}
    max-tokens: ${AI_MAX_TOKENS:512}
    context-window: ${AI_CONTEXT_WINDOW:4096}
    ollama:
      base-url: ${OLLAMA_BASE_URL}
      model: ${OLLAMA_MODEL}
    openai:
      base-url: ${OPENAI_BASE_URL}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL}
  agent:
    mode: ${AGENT_MODE:legacy}
    model: ${AGENT_MODEL:}
    max-model-calls: ${AGENT_MAX_MODEL_CALLS:6}
    max-tool-calls: ${AGENT_MAX_TOOL_CALLS:8}
    max-identical-tool-calls: ${AGENT_MAX_IDENTICAL_TOOL_CALLS:2}
    max-argument-repairs: ${AGENT_MAX_ARGUMENT_REPAIRS:1}
    timeout: ${AGENT_TIMEOUT:60s}
    tool-timeout: ${AGENT_TOOL_TIMEOUT:10s}
    max-tool-result-chars: ${AGENT_MAX_TOOL_RESULT_CHARS:6000}
    max-total-tool-result-chars: ${AGENT_MAX_TOTAL_TOOL_RESULT_CHARS:18000}
    metadata-retention: ${AGENT_METADATA_RETENTION:7d}
    cleanup-interval-ms: ${AGENT_METADATA_CLEANUP_INTERVAL_MS:3600000}
    schema-version: ${AGENT_SCHEMA_VERSION:mindcare-agent-v1}
    tool-calling-verified: ${AGENT_TOOL_CALLING_VERIFIED:false}
  chat:
    history-limit: ${CHAT_HISTORY_LIMIT:10}
    short-memory-ttl-hours: ${CHAT_SHORT_MEMORY_TTL_HOURS:24}
  embedding:
    base-url: ${DASHSCOPE_BASE_URL}
    api-key: ${DASHSCOPE_API_KEY:}
    model: ${EMBEDDING_MODEL}
    dimensions: ${EMBEDDING_DIMENSIONS:1024}
  knowledge:
    top-k: ${RAG_TOP_K:4}
    retrieval-mode: ${RAG_RETRIEVAL_MODE:QDRANT_REQUIRED}
    use-qdrant: ${USE_QDRANT:true}
    qdrant-base-url: ${QDRANT_BASE_URL:http://localhost:6333}
    qdrant-index-prefix: ${QDRANT_COLLECTION_PREFIX:mindcare-knowledge}
    qdrant-active-alias: ${QDRANT_ACTIVE_ALIAS:mindcare-knowledge-active}
    rerank-enabled: ${RAG_RERANK_ENABLED:true}
    rerank-candidate-multiplier: ${RAG_RERANK_CANDIDATE_MULTIPLIER:3}
    rerank-semantic-weight: ${RAG_RERANK_SEMANTIC_WEIGHT:0.75}
    rerank-keyword-weight: ${RAG_RERANK_KEYWORD_WEIGHT:0.25}
    minimum-evidence-score: ${RAG_MIN_EVIDENCE_SCORE:0.2}
    chunk-size: ${KNOWLEDGE_CHUNK_SIZE:512}
    chunk-overlap: ${KNOWLEDGE_CHUNK_OVERLAP:80}
    chunking-strategy: ${KNOWLEDGE_CHUNKING_STRATEGY:HIERARCHICAL_V1}
    parent-max-size: ${KNOWLEDGE_PARENT_MAX_SIZE:900}
    child-min-size: ${KNOWLEDGE_CHILD_MIN_SIZE:120}
    child-target-size: ${KNOWLEDGE_CHILD_TARGET_SIZE:240}
    child-max-size: ${KNOWLEDGE_CHILD_MAX_SIZE:320}
    child-overlap: ${KNOWLEDGE_CHILD_OVERLAP:40}
    evidence-character-budget: ${RAG_EVIDENCE_CHARACTER_BUDGET:2200}
    index-sync:
      enabled: ${RAG_INDEX_SYNC_ENABLED:true}
      poll-interval-ms: ${RAG_INDEX_POLL_INTERVAL_MS:1000}
      max-attempts: ${RAG_INDEX_MAX_ATTEMPTS:5}
      base-retry-delay-seconds: ${RAG_INDEX_BASE_RETRY_DELAY_SECONDS:5}
      lease-seconds: ${RAG_INDEX_LEASE_SECONDS:60}
      batch-size: ${RAG_INDEX_BATCH_SIZE:2}
  memory:
    enabled: ${LONG_TERM_MEMORY_ENABLED:true}
    fact-collection: ${MEMORY_FACT_COLLECTION:memory-facts}
    topic-collection: ${MEMORY_TOPIC_COLLECTION:memory-topics}
    neo4j-base-url: ${NEO4J_BASE_URL:http://localhost:7474}
    neo4j-username: ${NEO4J_USERNAME:neo4j}
    neo4j-password: ${NEO4J_PASSWORD:change-me}
    top-k: ${MEMORY_TOP_K:8}
    bm25-enabled: ${MEMORY_BM25_ENABLED:true}
    bm25-weight: ${MEMORY_BM25_WEIGHT:0.3}
    bm25-candidate-multiplier: ${MEMORY_BM25_CANDIDATE_MULTIPLIER:3}
    bm25-fusion-method: ${MEMORY_BM25_FUSION_METHOD:rrf}
    bm25-max-cached-users: ${MEMORY_BM25_MAX_CACHED_USERS:128}
    bm25-max-cached-facts: ${MEMORY_BM25_MAX_CACHED_FACTS:100000}
    bm25-refresh-interval-seconds: ${MEMORY_BM25_REFRESH_INTERVAL_SECONDS:30}
    graph-hops: ${MEMORY_GRAPH_HOPS:3}
    temporal-window: ${MEMORY_TEMPORAL_WINDOW:2}
    max-attempts: ${MEMORY_MAX_ATTEMPTS:5}
    poll-interval-ms: ${MEMORY_POLL_INTERVAL_MS:1000}
    base-retry-delay-seconds: ${MEMORY_BASE_RETRY_DELAY_SECONDS:5}
    lease-seconds: ${MEMORY_LEASE_SECONDS:120}
    batch-size: ${MEMORY_BATCH_SIZE:4}
  evaluation:
    enabled: ${EVAL_MODE:false}
    output-dir: ${EVAL_OUTPUT_DIR:./benchmarks/results/traces}
  multimodal:
    text-weight: ${MULTIMODAL_TEXT_WEIGHT:0.1}
    audio-weight: ${MULTIMODAL_AUDIO_WEIGHT:0.4}
    visual-weight: ${MULTIMODAL_VISUAL_WEIGHT:0.5}
    whisper:
      mode: ${WHISPER_MODE:mock}
      base-url: ${WHISPER_BASE_URL:${OPENAI_BASE_URL}}
      api-key: ${WHISPER_API_KEY:${OPENAI_API_KEY:}}
      model: ${WHISPER_MODEL}
    media-pipe:
      mode: ${MEDIAPIPE_MODE:local-rule}
      url: ${MEDIAPIPE_URL}
  mcp:
    excel:
      mode: ${MCP_EXCEL_MODE:mcp}
      url: ${MCP_EXCEL_URL}
      local-path: ${MCP_EXCEL_LOCAL_PATH:./data/multimodalAgent-reports.xlsx}
    email:
      mode: ${MCP_EMAIL_MODE:mcp}
      url: ${MCP_EMAIL_URL}
      from: ${ALERT_MAIL_FROM:multimodalAgent-alerts@example.com}
      recipients: ${ALERT_MAIL_RECIPIENTS:counselor-alerts@example.com}
      max-retries: ${ALERT_MAIL_MAX_RETRIES:2}
  delivery:
    poll-interval-ms: ${DELIVERY_POLL_INTERVAL_MS:1000}
    max-attempts: ${DELIVERY_MAX_ATTEMPTS:0}
    base-retry-delay-seconds: ${DELIVERY_BASE_RETRY_DELAY_SECONDS:5}
    lease-seconds: ${DELIVERY_LEASE_SECONDS:60}
    batch-size: ${DELIVERY_BATCH_SIZE:10}
  resilience:
    http-connect-timeout-ms: ${HTTP_CONNECT_TIMEOUT_MS:2000}
    http-response-timeout-ms: ${HTTP_RESPONSE_TIMEOUT_MS:120000}
  audit:
    resource-hash-secret: ${AUDIT_RESOURCE_HASH_SECRET}
  security:
    demo-accounts-enabled: ${DEMO_ACCOUNTS_ENABLED:false}
    auth-session-store: ${AUTH_SESSION_STORE:redis}
    jwt-issuer: ${JWT_ISSUER:multimodalAgent-agent}
    jwt-secret: ${JWT_SECRET}
    access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:14d}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
  risk-case:
    escalation:
      poll-interval-ms: ${RISK_CASE_ESCALATION_POLL_INTERVAL_MS:60000}
    sla:
      high-risk-case-response: ${RISK_CASE_HIGH_RISK_RESPONSE:2h}
      referral-response: ${RISK_CASE_REFERRAL_RESPONSE:72h}
      response-policy:
        none:
          opens-case: false
          notifies-staff: false
        low:
          opens-case: false
          notifies-staff: false
        medium:
          opens-case: false
          notifies-staff: false
        high:
          opens-case: ${RISK_HIGH_OPENS_CASE:true}
          notifies-staff: ${RISK_HIGH_NOTIFIES_STAFF:true}
