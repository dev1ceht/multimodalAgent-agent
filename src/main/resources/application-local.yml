spring:
  datasource:
    url: ${LOCAL_DB_URL}
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}
    driver-class-name: ${LOCAL_DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
  flyway:
    enabled: false

multimodal-agent:
  knowledge:
    retrieval-mode: ${RAG_RETRIEVAL_MODE:LOCAL_BASELINE}
    use-elasticsearch: ${USE_ELASTICSEARCH:false}
  mcp:
    excel:
      mode: ${MCP_EXCEL_MODE:local}
    email:
      mode: ${MCP_EMAIL_MODE:log}
  security:
    demo-accounts-enabled: ${DEMO_ACCOUNTS_ENABLED:true}
    auth-session-store: ${AUTH_SESSION_STORE:memory}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
