name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observability-config:
    name: Observability configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate Prometheus configuration
        run: >-
          docker run --rm --entrypoint=/bin/promtool
          -v "$PWD/observability/prometheus:/etc/prometheus:ro"
          prom/prometheus:v3.13.1
          check config /etc/prometheus/prometheus.yml
      - name: Validate Alertmanager configuration
        run: >-
          docker run --rm --entrypoint=/bin/amtool
          -v "$PWD/observability/alertmanager:/etc/alertmanager:ro"
          prom/alertmanager:v0.33.1
          check-config /etc/alertmanager/alertmanager.yml
      - name: Validate Loki configuration
        run: >-
          docker run --rm
          -v "$PWD/observability/loki:/etc/loki:ro"
          grafana/loki:3.7.3
          -config.file=/etc/loki/loki.yml -verify-config=true
      - name: Validate Tempo configuration
        run: >-
          docker run --rm
          -v "$PWD/observability/tempo:/etc/tempo:ro"
          grafana/tempo:2.10.7
          --config.file=/etc/tempo/tempo.yml --config.verify=true
      - name: Validate Alloy configuration
        run: >-
          docker run --rm
          -v "$PWD/observability/alloy:/etc/alloy:ro"
          grafana/alloy:v1.18.0
          validate /etc/alloy/config.alloy

  test:
    name: Java tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run test suite
        run: mvn --batch-mode --no-transfer-progress -DforkCount=0 test
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore
          retention-days: 7

  mysql-migration-smoke:
    name: MySQL migration smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes default-mysql-client
      - name: Run Flyway V0 through V5 smoke
        shell: pwsh
        run: ./scripts/mysql-migration-smoke.ps1
      - name: Upload migration smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mysql-migration-smoke-logs
          path: |
            target/mysql-migration-smoke-*.log
          if-no-files-found: ignore
          retention-days: 7
