route:
  receiver: local-mailpit
  group_by:
    - alertname
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: local-mailpit
    email_configs:
      - to: operations@example.com
        from: alertmanager@example.com
        smarthost: mailpit:1025
        require_tls: false
        send_resolved: true
