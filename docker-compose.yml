services:
  app:
    build: .
    image: multimodalAgent-agent:0.1.0
    container_name: multimodalAgent-agent
    environment:
      SERVER_PORT: 8080
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
      MANAGEMENT_SERVER_PORT: 9090
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.1}
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local-compose}
      LOG_FILE: /app/logs/application.log
      SPRING_PROFILES_ACTIVE: mysql
      DB_URL: jdbc:mysql://mysql:3306/multimodalAgent?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      DB_USERNAME: multimodalAgent
      DB_PASSWORD: multimodalAgent
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SESSION_STORE: redis
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to at least 32 random bytes}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
      DEMO_ACCOUNTS_ENABLED: ${DEMO_ACCOUNTS_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-multimodalAgent-qwen3.5-9b-benchmark:latest}
      RAG_RETRIEVAL_MODE: ${RAG_RETRIEVAL_MODE:-ELASTICSEARCH_REQUIRED}
      USE_ELASTICSEARCH: ${USE_ELASTICSEARCH:-true}
      ELASTICSEARCH_BASE_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX_PREFIX: ${ELASTICSEARCH_INDEX_PREFIX:-mindcare-knowledge}
      ELASTICSEARCH_ACTIVE_ALIAS: ${ELASTICSEARCH_ACTIVE_ALIAS:-mindcare-knowledge-active}
      RAG_KNN_K: ${RAG_KNN_K:-50}
      RAG_KNN_NUM_CANDIDATES: ${RAG_KNN_NUM_CANDIDATES:-200}
      RAG_RRF_RANK_WINDOW_SIZE: ${RAG_RRF_RANK_WINDOW_SIZE:-50}
      RAG_RRF_RANK_CONSTANT: ${RAG_RRF_RANK_CONSTANT:-60}
      USE_CHROMA: ${USE_CHROMA:-false}
      CHROMA_BASE_URL: http://chroma:8000
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://llm-mgkt5ssh21a7fk0w.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      MCP_EXCEL_MODE: ${MCP_EXCEL_MODE:-local}
      MCP_EMAIL_MODE: ${MCP_EMAIL_MODE:-log}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8080:8080"
    expose:
      - "9090"
    volumes:
      - ./data:/app/data
      - app-logs:/app/logs

  mysql:
    image: mysql:8.4
    container_name: multimodalAgent-mysql
    environment:
      MYSQL_DATABASE: multimodalAgent
      MYSQL_USER: multimodalAgent
      MYSQL_PASSWORD: multimodalAgent
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  redis:
    image: redis:7.2-alpine
    container_name: multimodalAgent-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  chroma:
    profiles: ["legacy-chroma"]
    image: chromadb/chroma:1.5.9
    container_name: multimodalAgent-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/chroma/chroma

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.0
    container_name: multimodalAgent-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  mailpit:
    image: axllent/mailpit:latest
    container_name: multimodalAgent-mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  alertmanager:
    profiles: ["observability"]
    image: prom/alertmanager:v0.33.1
    container_name: multimodalAgent-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    depends_on:
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.13.1
    container_name: multimodalAgent-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    depends_on:
      app:
        condition: service_started
      alertmanager:
        condition: service_started
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.7.3
    container_name: multimodalAgent-loki
    command:
      - -config.file=/etc/loki/loki.yml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  tempo:
    profiles: ["observability"]
    image: grafana/tempo:2.10.7
    container_name: multimodalAgent-tempo
    command:
      - -config.file=/etc/tempo/tempo.yml
    ports:
      - "127.0.0.1:3200:3200"
    expose:
      - "4317"
      - "4318"
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo

  alloy:
    profiles: ["observability"]
    image: grafana/alloy:v1.18.0
    container_name: multimodalAgent-alloy
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local-compose}
    depends_on:
      loki:
        condition: service_started
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - app-logs:/var/log/multimodalagent:ro
      - alloy-data:/var/lib/alloy/data

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:13.1.0
    container_name: multimodalAgent-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-observability-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  app-logs:
  mysql-data:
  redis-data:
  chroma-data:
  elasticsearch-data:
  alertmanager-data:
  prometheus-data:
  loki-data:
  tempo-data:
  alloy-data:
  grafana-data:
