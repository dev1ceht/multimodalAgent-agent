services:
  app:
    build: .
    image: multimodalagent-agent:0.1.0
    container_name: multimodalAgent-agent
    environment:
      SERVER_PORT: ${SERVER_PORT:?Set SERVER_PORT}
      MANAGEMENT_SERVER_ADDRESS: ${COMPOSE_MANAGEMENT_SERVER_ADDRESS:-0.0.0.0}
      MANAGEMENT_SERVER_PORT: ${COMPOSE_MANAGEMENT_SERVER_PORT:?Set COMPOSE_MANAGEMENT_SERVER_PORT}
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.1}
      OTLP_TRACING_ENDPOINT: ${COMPOSE_OTLP_TRACING_ENDPOINT:?Set COMPOSE_OTLP_TRACING_ENDPOINT}
      DEPLOYMENT_ENVIRONMENT: ${COMPOSE_DEPLOYMENT_ENVIRONMENT:-local-compose}
      LOG_FILE: ${COMPOSE_LOG_FILE:-/app/logs/application.log}
      SPRING_PROFILES_ACTIVE: ${COMPOSE_SPRING_PROFILES_ACTIVE:?Set COMPOSE_SPRING_PROFILES_ACTIVE}
      DB_URL: ${COMPOSE_DB_URL:?Set COMPOSE_DB_URL}
      DB_USERNAME: ${MYSQL_USER:?Set MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      REDIS_HOST: ${COMPOSE_REDIS_HOST:?Set COMPOSE_REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      AUTH_SESSION_STORE: ${COMPOSE_AUTH_SESSION_STORE:-redis}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to at least 32 random bytes}
      AUDIT_RESOURCE_HASH_SECRET: ${AUDIT_RESOURCE_HASH_SECRET:?Set AUDIT_RESOURCE_HASH_SECRET}
      REFRESH_COOKIE_SECURE: ${COMPOSE_REFRESH_COOKIE_SECURE:-true}
      DEMO_ACCOUNTS_ENABLED: ${COMPOSE_DEMO_ACCOUNTS_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.35}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-512}
      AI_CONTEXT_WINDOW: ${AI_CONTEXT_WINDOW:-4096}
      AGENT_MODE: ${AGENT_MODE:-saa}
      OLLAMA_BASE_URL: ${COMPOSE_OLLAMA_BASE_URL:?Set COMPOSE_OLLAMA_BASE_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL:?Set OLLAMA_MODEL}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:?Set OPENAI_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:?Set OPENAI_MODEL}
      RAG_RETRIEVAL_MODE: ${COMPOSE_RAG_RETRIEVAL_MODE:-QDRANT_REQUIRED}
      USE_QDRANT: ${COMPOSE_USE_QDRANT:-true}
      QDRANT_BASE_URL: ${COMPOSE_QDRANT_BASE_URL:-http://qdrant:6333}
      QDRANT_COLLECTION_PREFIX: ${QDRANT_COLLECTION_PREFIX:-mindcare-knowledge}
      KNOWLEDGE_INGESTION_MODE: ${COMPOSE_KNOWLEDGE_INGESTION_MODE:-kafka-minio}
      KAFKA_BOOTSTRAP_SERVERS: ${COMPOSE_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      MINIO_ENDPOINT: ${COMPOSE_MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      MINIO_KNOWLEDGE_BUCKET: ${MINIO_KNOWLEDGE_BUCKET:-mindcare-knowledge}
      LONG_TERM_MEMORY_ENABLED: ${LONG_TERM_MEMORY_ENABLED:-true}
      MEMORY_FACT_COLLECTION: ${MEMORY_FACT_COLLECTION:-memory-facts}
      MEMORY_TOPIC_COLLECTION: ${MEMORY_TOPIC_COLLECTION:-memory-topics}
      MEMORY_TOP_K: ${MEMORY_TOP_K:-8}
      MEMORY_BM25_ENABLED: ${MEMORY_BM25_ENABLED:-true}
      MEMORY_BM25_WEIGHT: ${MEMORY_BM25_WEIGHT:-0.3}
      MEMORY_BM25_CANDIDATE_MULTIPLIER: ${MEMORY_BM25_CANDIDATE_MULTIPLIER:-3}
      MEMORY_BM25_FUSION_METHOD: ${MEMORY_BM25_FUSION_METHOD:-rrf}
      MEMORY_BM25_MAX_CACHED_USERS: ${MEMORY_BM25_MAX_CACHED_USERS:-128}
      MEMORY_BM25_MAX_CACHED_FACTS: ${MEMORY_BM25_MAX_CACHED_FACTS:-100000}
      MEMORY_BM25_REFRESH_INTERVAL_SECONDS: ${MEMORY_BM25_REFRESH_INTERVAL_SECONDS:-30}
      MEMORY_GRAPH_HOPS: ${MEMORY_GRAPH_HOPS:-3}
      MEMORY_TEMPORAL_WINDOW: ${MEMORY_TEMPORAL_WINDOW:-2}
      MEMORY_POLL_INTERVAL_MS: ${MEMORY_POLL_INTERVAL_MS:-1000}
      MEMORY_MAX_ATTEMPTS: ${MEMORY_MAX_ATTEMPTS:-5}
      MEMORY_BASE_RETRY_DELAY_SECONDS: ${MEMORY_BASE_RETRY_DELAY_SECONDS:-5}
      MEMORY_LEASE_SECONDS: ${MEMORY_LEASE_SECONDS:-120}
      MEMORY_BATCH_SIZE: ${MEMORY_BATCH_SIZE:-4}
      NEO4J_BASE_URL: ${COMPOSE_NEO4J_BASE_URL:-http://neo4j:7474}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:?Set DASHSCOPE_BASE_URL}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?Set EMBEDDING_MODEL}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      WHISPER_BASE_URL: ${WHISPER_BASE_URL:?Set WHISPER_BASE_URL}
      WHISPER_API_KEY: ${WHISPER_API_KEY:-}
      WHISPER_MODEL: ${WHISPER_MODEL:?Set WHISPER_MODEL}
      MEDIAPIPE_URL: ${MEDIAPIPE_URL:?Set MEDIAPIPE_URL}
      MCP_EXCEL_MODE: ${COMPOSE_MCP_EXCEL_MODE:-local}
      MCP_EXCEL_URL: ${COMPOSE_MCP_EXCEL_URL:?Set COMPOSE_MCP_EXCEL_URL}
      MCP_EMAIL_MODE: ${COMPOSE_MCP_EMAIL_MODE:-log}
      MCP_EMAIL_URL: ${COMPOSE_MCP_EMAIL_URL:?Set COMPOSE_MCP_EMAIL_URL}
      ALERT_MAIL_FROM: ${ALERT_MAIL_FROM:-multimodalAgent-alerts@example.com}
      ALERT_MAIL_RECIPIENTS: ${ALERT_MAIL_RECIPIENTS:-counselor-alerts@example.com}
      MAIL_HOST: ${COMPOSE_MAIL_HOST:?Set COMPOSE_MAIL_HOST}
      MAIL_PORT: ${COMPOSE_MAIL_PORT:-1025}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "${APP_HOST_PORT:?Set APP_HOST_PORT}:${SERVER_PORT:?Set SERVER_PORT}"
    expose:
      - "${COMPOSE_MANAGEMENT_SERVER_PORT:?Set COMPOSE_MANAGEMENT_SERVER_PORT}"
    volumes:
      - ./data:/app/data
      - app-logs:/app/logs

  mysql:
    image: mysql:8.4
    container_name: multimodalAgent-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  redis:
    image: redis:7.2-alpine
    container_name: multimodalAgent-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.16.2
    container_name: multimodalAgent-qdrant
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s

  kafka:
    image: apache/kafka:3.9.0
    container_name: multimodalAgent-kafka
    environment:
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-29092}:29092"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: multimodalAgent-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KNOWLEDGE_PARSE_TOPIC: ${KNOWLEDGE_PARSE_TOPIC:-mindcare.knowledge.parse-requested.v1}
      KNOWLEDGE_INDEX_TOPIC: ${KNOWLEDGE_INDEX_TOPIC:-mindcare.knowledge.index-requested.v1}
      KNOWLEDGE_DLT_TOPIC: ${KNOWLEDGE_DLT_TOPIC:-mindcare.knowledge.dead-letter.v1}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - >-
        for topic in "$${KNOWLEDGE_PARSE_TOPIC}" "$${KNOWLEDGE_INDEX_TOPIC}" "$${KNOWLEDGE_DLT_TOPIC}"; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
          --create --if-not-exists --topic "$${topic}" --partitions 3 --replication-factor 1;
        done

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: multimodalAgent-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: multimodalAgent-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      MINIO_KNOWLEDGE_BUCKET: ${MINIO_KNOWLEDGE_BUCKET:-mindcare-knowledge}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
        mc mb --ignore-existing "local/$${MINIO_KNOWLEDGE_BUCKET}";
        mc anonymous set private "local/$${MINIO_KNOWLEDGE_BUCKET}";


  neo4j:
    image: neo4j:5.26-community
    container_name: multimodalAgent-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
    ports:
      - "127.0.0.1:${NEO4J_HTTP_HOST_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_HOST_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 25s

  mailpit:
    image: axllent/mailpit:latest
    container_name: multimodalAgent-mailpit
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_WEB_HOST_PORT:-8025}:8025"

  alertmanager:
    profiles: ["observability"]
    image: prom/alertmanager:v0.33.1
    container_name: multimodalAgent-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    depends_on:
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.13.1
    container_name: multimodalAgent-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    depends_on:
      app:
        condition: service_started
      alertmanager:
        condition: service_started
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.7.3
    container_name: multimodalAgent-loki
    command:
      - -config.file=/etc/loki/loki.yml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  tempo:
    profiles: ["observability"]
    image: grafana/tempo:2.10.7
    container_name: multimodalAgent-tempo
    command:
      - -config.file=/etc/tempo/tempo.yml
    ports:
      - "127.0.0.1:3200:3200"
    expose:
      - "4317"
      - "4318"
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo

  alloy:
    profiles: ["observability"]
    image: grafana/alloy:v1.18.0
    container_name: multimodalAgent-alloy
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local-compose}
    depends_on:
      loki:
        condition: service_started
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - app-logs:/var/log/multimodalagent:ro
      - alloy-data:/var/lib/alloy/data

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:13.1.0
    container_name: multimodalAgent-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  app-logs:
  mysql-data:
  redis-data:
  qdrant-data:
  kafka-data:
  minio-data:
  neo4j-data:
  alertmanager-data:
  prometheus-data:
  loki-data:
  tempo-data:
  alloy-data:
  grafana-data:
